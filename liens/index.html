<style>
:root{--ink:#1B2D4F;--ink-soft:#33427A;--blue:#9DBBFF;--pale:#C6D5F7}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--pale);color:var(--ink);font-family:'Manrope',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.3px;line-height:1.5;display:flex;justify-content:center;align-items:flex-start;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:0;background:linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,.34)),url(fond.jpg) 50% 30%/cover no-repeat;pointer-events:none}
body::after{content:"";position:fixed;inset:0;z-index:0;-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);pointer-events:none}
main{position:relative;z-index:1;width:100%;max-width:540px;margin:clamp(14px,5vh,56px) 14px;padding:44px 22px 30px;display:flex;flex-direction:column;align-items:center;text-align:center;border-radius:32px;background:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.75);box-shadow:0 30px 60px -28px rgba(27,45,79,.55)}
.avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;object-position:50% 50%;background:var(--pale);box-shadow:0 0 0 3px #fff,0 0 0 4.5px var(--blue)}
h1{margin:18px 0 4px;font-family:'Stack Sans Headline','Manrope',sans-serif;font-weight:700;font-size:26px;letter-spacing:-.035em;line-height:1.1;text-wrap:balance}
.role{margin:0;font-weight:700;color:var(--ink-soft);font-size:15.5px}
.bio{margin:10px 0 0;width:100%;font-size:13.5px;font-weight:500;color:var(--ink-soft);text-wrap:balance}
@media (min-width:520px){.bio span{display:block}}
.icones{display:flex;justify-content:center;gap:22px;margin:18px 0 0;padding:0;list-style:none}
.icones a{display:flex;color:var(--ink);transition:transform .18s,color .18s}
.icones a:hover,.icones a:focus-visible{transform:translateY(-2px);color:var(--ink-soft)}
.icones a:focus-visible{outline:3px solid var(--blue);outline-offset:4px;border-radius:8px}
.icones svg{width:26px;height:26px}
.liens{list-style:none;margin:26px 0 0;padding:0;width:100%;display:flex;flex-direction:column;gap:12px}
.lien{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:12px 18px;border-radius:16px;background:#fff;color:var(--ink);text-decoration:none;font-weight:700;font-size:16px;letter-spacing:-.3px;box-shadow:0 1px 0 rgba(27,45,79,.06),0 10px 22px -16px rgba(27,45,79,.45);transition:background .18s,color .18s,transform .18s,box-shadow .18s}
.lien svg{flex:none;width:24px;height:24px}
.lien .t{flex:1;min-width:0;text-align:center;padding-right:20px;line-height:1.25}
.lien small{display:block;margin-top:2px;font-weight:500;font-size:11px;color:var(--ink-soft);white-space:nowrap;letter-spacing:-.2px}
.lien:hover,.lien:focus-visible{transform:translateY(-2px);box-shadow:0 14px 26px -16px rgba(27,45,79,.6);background:#F3F7FF}
.lien:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.lien.principal{background:var(--ink);color:#fff}
.lien.principal:hover,.lien.principal:focus-visible{background:var(--ink-soft)}
svg.f{fill:currentColor}
svg.l{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:380px){main{padding:36px 16px 24px}.lien{font-size:15px}}
@media (prefers-reduced-motion:reduce){.lien,.icones a{transition:none}}
</style>
